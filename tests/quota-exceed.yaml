# Charge VOLONTAIREMENT au-dessus du quota de dev (limits.memory 512Mi) : 2 x 384Mi = 768Mi.
# Chaque conteneur respecte le LimitRange (max 512Mi) : c'est bien le ResourceQuota qui doit refuser.
apiVersion: v1
kind: Pod
metadata:
  name: quota-exceed
spec:
  containers:
    - name: a
      image: busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 384Mi}
    - name: b
      image: busybox:1.36.1
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 384Mi}
