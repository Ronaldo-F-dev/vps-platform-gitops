# Les droits viennent des ClusterRoles standard, mais liés par RoleBinding : ils ne valent que dans le
# namespace où le RoleBinding est créé. Aucun ClusterRoleBinding pour ces comptes.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-edit
subjects:
  - kind: ServiceAccount
    name: deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-view
subjects:
  - kind: ServiceAccount
    name: viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
