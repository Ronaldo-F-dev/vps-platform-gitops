# Identité d'exécution des pods : aucun droit sur l'API, jeton non monté par défaut.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
automountServiceAccountToken: false

---
# Compte de déploiement : modifie les ressources de SON namespace uniquement (cf. rolebindings.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
