# Application minimale du Projet 2 : répond avec le nom du pod et les en-têtes de la requête.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app.kubernetes.io/name: whoami
    app.kubernetes.io/part-of: vps-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami
        app.kubernetes.io/part-of: vps-platform
    spec:
      serviceAccountName: app
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
